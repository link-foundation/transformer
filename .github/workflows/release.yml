name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify release version and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ -n "$RELEASE_TAG" ]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            test "$RELEASE_TAG" = "v$version" || {
              echo "::error::Release tag must match Cargo.toml: v$version"
              exit 1
            }
          fi
      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        continue-on-error: true
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_BUILD_JOBS: 1
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::No crates.io credentials. Bootstrap the crate and register release.yml as a trusted publisher (see docs/releasing.md), or configure CARGO_REGISTRY_TOKEN / CARGO_TOKEN."
            exit 1
          fi
          cargo publish --locked
